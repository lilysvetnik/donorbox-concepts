<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supporter segments: concept prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EEF0F3; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#111827; --ink-2:#374151; --muted:#6B7280;
  --line:#E5E7EB; --line-2:#D1D5DB; --blue:#2F6FED; --blue-ink:#1D4ED8; --blue-soft:#EAF1FE; --blue-line:#A9C3F7;
  --navy:#1E2A45; --green-soft:#E7F6EC; --green-ink:#1F7A45; --gray-soft:#F1F2F4;
  --amber-soft:#FFF4E5; --amber-ink:#8A4B00; --red-soft:#FDECEC; --red-ink:#A61B1B;
  --note-bg:#FFF6D1; --note-line:#EAD58A; --note-ink:#4A3A00; --pin:#F5C518; --pin-ink:#2B2200;
  --shadow:0 12px 40px rgba(17,24,39,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0F141C; --surface:#161C26; --surface-2:#1B2230; --ink:#E8EBF0; --ink-2:#C6CCD6; --muted:#8C95A3;
    --line:#2A3342; --line-2:#364152; --blue:#5B8DF6; --blue-ink:#9DBBFA; --blue-soft:#1C2A45; --blue-line:#34508A;
    --navy:#0B1220; --green-soft:#16301F; --green-ink:#7FD3A0; --gray-soft:#232B38;
    --amber-soft:#33260F; --amber-ink:#F2C27A; --red-soft:#3A1A1A; --red-ink:#F2A3A3;
    --note-bg:#2E2A17; --note-line:#5A4F22; --note-ink:#F1E3A6; --pin:#E0B82E; --pin-ink:#1A1400;
    --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0F141C; --surface:#161C26; --surface-2:#1B2230; --ink:#E8EBF0; --ink-2:#C6CCD6; --muted:#8C95A3;
  --line:#2A3342; --line-2:#364152; --blue:#5B8DF6; --blue-ink:#9DBBFA; --blue-soft:#1C2A45; --blue-line:#34508A;
  --navy:#0B1220; --green-soft:#16301F; --green-ink:#7FD3A0; --gray-soft:#232B38;
  --amber-soft:#33260F; --amber-ink:#F2C27A; --red-soft:#3A1A1A; --red-ink:#F2A3A3;
  --note-bg:#2E2A17; --note-line:#5A4F22; --note-ink:#F1E3A6; --pin:#E0B82E; --pin-ink:#1A1400;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:24px 24px 48px}

/* Review chrome */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 32px;margin-bottom:16px}
.top h1{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);max-width:70ch}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--blue-soft);color:var(--blue-ink)}
.steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;align-items:center}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 12px 8px 8px;border-radius:999px;font-weight:500;color:var(--ink-2)}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--gray-soft);color:var(--muted)}
.step[aria-current="step"]{border-color:var(--blue);color:var(--blue-ink);background:var(--blue-soft)}
.step[aria-current="step"] .n{background:var(--blue);color:#fff}
.notes-toggle{margin-left:auto;flex:0 0 auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:500;border:0;background:none;padding:6px}
.notes-toggle .sw{width:34px;height:20px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s}
.notes-toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.notes-toggle[aria-pressed="true"] .sw{background:var(--pin)}
.notes-toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.stage.no-notes{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.stage{grid-template-columns:minmax(0,1fr)}}

/* Margin notes */
.notes{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.notes h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 2px}
.note{background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-ink);border-radius:4px 14px 14px 14px;padding:12px 14px 13px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.note b{font-weight:600}
.note p{margin:0;grid-column:2;font-size:13px}
.pin{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--pin);color:var(--pin-ink);font-size:11px;font-weight:700;border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);vertical-align:middle;margin-left:6px;flex:0 0 auto}
.note .pin{margin:0;border-color:var(--note-bg)}
.hide-notes .pin{display:none}

/* Mock app */
.app{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:760px;position:relative}
.side{width:64px;flex:0 0 64px;background:var(--navy);display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:20px}
.side i{display:block;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.3)}
.side i.logo{width:30px;height:30px;border-radius:8px;background:#E11D48}
.side i.on{background:rgba(255,255,255,.9)}
.main{flex:1;min-width:0;padding:22px 32px 36px;display:flex;flex-direction:column;gap:18px}
.gsearch{display:flex;gap:16px;align-items:center}
.gsearch .box{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;color:var(--muted)}
.gsearch .org{font-weight:600;white-space:nowrap}
.titlebar{display:flex;align-items:center;gap:12px}
.titlebar h3{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.link{border-color:transparent;background:transparent;color:var(--blue-ink);padding:6px 4px}
.btn:hover{filter:brightness(.97)}
.spacer{flex:1}

/* Buckets */
.reach{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.reach .label{font-weight:600;margin-right:4px}
.bucket{position:relative}
.groupby{margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.groupby .gl{margin-right:6px}
.groupby button{border:1px solid var(--line-2);background:var(--surface);padding:5px 10px;font:inherit;color:var(--ink,inherit);cursor:pointer}
.groupby button:first-of-type{border-radius:999px 0 0 999px}
.groupby button:last-of-type{border-radius:0 999px 999px 0;margin-left:-1px}
.groupby button[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600;position:relative}
.bbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600}
.bbtn .chev{color:var(--muted);font-size:11px;transition:transform .15s}
.bbtn[aria-expanded="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.bbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.bbtn.selected{background:var(--blue);border-color:var(--blue);color:#fff}
.bbtn.selected .x{opacity:.85;margin-left:2px}
.menu{position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:340px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px}
.menu .mh{padding:8px 10px 6px;color:var(--muted);font-size:12px}
.seg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px}
.seg:hover,.seg:focus-visible{background:var(--surface-2)}
.seg .t{display:block;font-weight:600}
.seg .r{display:block;color:var(--muted);font-size:12.5px}
.seg .go{margin-left:auto;color:var(--muted)}
.ev{color:var(--blue-ink);font-weight:600;border-bottom:1.5px dashed var(--blue-line);padding-bottom:1px}
.mhint{margin:0 10px 6px;padding:8px 10px;border-radius:8px;background:var(--blue-soft);color:var(--ink-2);font-size:12.5px}
.details{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted)}
.chip{border:1px dashed var(--line-2);background:var(--surface);border-radius:8px;padding:6px 11px;color:var(--ink);font-weight:500}

/* Picked segment panel */
.panel{background:var(--surface);border:1px solid var(--blue-line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.crumb{font-size:12px;color:var(--muted);font-weight:500}
.ph{display:flex;align-items:center;gap:10px}
.ph h4{margin:0;font-size:19px;font-weight:600}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--gray-soft);color:var(--ink-2)}
.rules{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14.5px}
.rule .k{font-weight:600}
.val{position:relative;display:inline-block}
.vbtn{border:1px solid var(--blue-line);background:var(--surface);color:var(--blue-ink);font-weight:600;border-radius:7px;padding:4px 10px}
.vbtn[aria-expanded="true"]{background:var(--blue-soft)}
.vmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:25;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.vmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:7px 10px}
.vmenu button:hover{background:var(--surface-2)}
.vmenu button[aria-checked="true"]{color:var(--blue-ink);font-weight:600}
.rm{border:0;background:transparent;color:var(--muted);font-size:15px;padding:2px 6px;border-radius:6px}
.rm:hover{background:var(--gray-soft)}
.hint{display:flex;gap:8px;color:var(--ink-2);font-size:13.5px}
.promo{border-radius:12px;border:1px solid var(--blue-line);background:linear-gradient(135deg,var(--blue-soft),var(--surface) 75%);overflow:hidden}
.ptip{display:flex;gap:8px;padding:12px 16px 4px;color:var(--ink);font-size:14.5px;font-weight:500}
.pact{display:flex;align-items:center;gap:12px;padding:6px 16px 14px;flex-wrap:wrap}
.pact .ptext{flex:1;min-width:220px;color:var(--ink-2);font-size:13.5px}
.pact .ptext b{color:var(--blue-ink)}
.bolt{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;background:var(--blue);color:#fff;font-size:14px;flex:0 0 auto}
.narrow{display:flex;align-items:center;gap:8px;position:relative;flex-wrap:wrap}
.nmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:25;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.nmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:8px 10px}
.nmenu button:hover{background:var(--surface-2)}
.nmenu small{display:block;color:var(--muted)}
.nmenu{width:280px;max-height:420px;overflow:auto}
.ngh{padding:8px 10px 4px;font-size:12px;font-weight:600;color:var(--muted)}

.adv .alead{margin:0;color:var(--ink-2)}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.aconn{width:46px;color:var(--muted);font-weight:500;font-size:13px}
.abox{display:inline-block;border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:4px 10px}
.abox.sel{min-width:160px}
.aval{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.aconn.join{border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue-ink);font-weight:600;border-radius:7px;padding:3px 8px;width:auto;min-width:46px;font-size:13px}
.arow.grp{align-items:flex-start}
.arow.grp .agroup{flex:1}
.seggroup{border-style:solid;border-color:var(--line)}
.seggroup .ag-h{color:var(--ink-2)}
.segblock .ag-h{display:flex;align-items:center;gap:6px}
.segblock .ag-h .spacer{flex:1}
.samegift{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-left:3px solid var(--blue);border-radius:6px;padding:8px 12px;line-height:1.45}
.optsw{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--muted);margin-right:12px}
.optsw span{margin-right:6px}
.optsw button{border:1px solid var(--line-2);background:var(--surface);padding:6px 12px;font:inherit;color:var(--ink);cursor:pointer}
.optsw button:first-of-type{border-radius:8px 0 0 8px}
.optsw button:last-of-type{border-radius:0 8px 8px 0;margin-left:-1px}
.optsw button[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink);font-weight:600;position:relative}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.frow .spacer{flex:1}
.pchip,.fchip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;border-radius:10px;padding:4px 6px 4px 12px;font-size:14px;position:relative}
.pchip{background:var(--blue-soft);border:1px solid var(--blue)}
.pchip .pk{font-weight:700;color:var(--blue-ink);margin-right:2px}
.fchip{background:var(--surface);border:1px solid var(--line-2)}
.fchip .fk{font-weight:600}
.readback{font-size:14px;line-height:1.5;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 12px}
.readback .loose{display:block;margin-top:2px;color:var(--ink);font-weight:600}
.negbtn{font-weight:600}
.negbtn[aria-pressed="true"]{background:var(--surface);border-color:var(--ink-2);color:var(--ink)}
.narrow.inrules{border-top:1px dashed var(--line-2);padding-top:8px;margin-top:2px}
.val.num{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--blue);border-radius:6px;padding:2px 6px;background:var(--surface)}
.val.num .cur{color:var(--blue-ink);font-weight:600}
.numin{width:72px;border:0;background:transparent;font:inherit;font-weight:600;color:var(--blue-ink);padding:2px 0}
.numin:focus{outline:none}
.val.num:focus-within{box-shadow:0 0 0 3px var(--blue-soft)}
.xgroup{border-left-color:var(--ink-2)}
.ggroup{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--blue-line);padding-left:10px}
.gsub{padding-left:14px}
.gsub.muted{color:var(--muted);font-size:13px}
.scope{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ornote{font-size:13px;color:var(--ink-2);background:var(--blue-soft);border-radius:8px;padding:6px 10px}
.agroup{border:1px dashed var(--blue-line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ag-h{font-size:12.5px;font-weight:600;color:var(--blue-ink)}
.aadd{display:flex;gap:12px}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.actions .count{font-size:16px;font-weight:600}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stat .l{color:var(--muted);font-weight:500;font-size:13px}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-.01em;margin-top:4px}
.stat .c{color:var(--muted);font-size:12px;margin-top:2px}
@media (max-width:700px){.stats{grid-template-columns:1fr}}

.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;background:var(--surface-2);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td.name{font-weight:600}
td.src{color:var(--green-ink);font-weight:500}
th.new,td.new{background:color-mix(in srgb,var(--green-soft) 55%,transparent)}
.badge{display:inline-block;font-size:12px;font-weight:500;border-radius:6px;padding:1px 7px;margin-left:6px;background:var(--gray-soft);color:var(--ink-2)}
.badge.ok{background:var(--green-soft);color:var(--green-ink)}
.badge.warn{background:var(--amber-soft);color:var(--amber-ink)}
.badge.bad{background:var(--red-soft);color:var(--red-ink)}
.tfoot{padding:12px 16px;color:var(--muted);font-size:13px}
.empty{padding:28px 16px;color:var(--ink-2)}

/* Modal */
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.45);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;z-index:40;overflow:auto}
.modal{width:min(680px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.mh2{display:flex;align-items:flex-start;gap:12px}
.mh2 h4{margin:0;font-size:19px;font-weight:600}
.mh2 p{margin:2px 0 0;color:var(--muted)}
.sect h5{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.who{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.who small{display:block;color:var(--muted);margin-top:4px}
.mail{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.day{background:var(--blue-soft);color:var(--blue-ink);font-weight:600;border-radius:6px;padding:3px 8px;font-size:12.5px;white-space:nowrap}
.mail .s{font-weight:600}
.mail small{display:block;color:var(--muted)}
.stopl{display:flex;flex-wrap:wrap;gap:6px}
.stopl span{background:var(--gray-soft);border-radius:7px;padding:5px 10px;font-size:13px}
.radio{display:flex;align-items:center;gap:10px;padding:6px 0;border:0;background:none;text-align:left}
.radio .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);display:inline-block;flex:0 0 auto}
.radio[aria-checked="true"] .dot{border-color:var(--blue);box-shadow:inset 0 0 0 3px var(--surface);background:var(--blue)}
.em .titlebar{margin-top:-6px}
.emtabs{display:flex;flex-wrap:wrap;gap:6px 26px;border-bottom:1px solid var(--line);padding-bottom:10px;color:var(--blue-ink)}
.emtabs span{padding-bottom:2px}
.emtabs .on{font-weight:600;border-bottom:2px solid var(--blue)}
.ctxbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--blue-soft);border-radius:10px;padding:10px 14px;color:var(--ink-2)}
.mjframe{border:2px dashed var(--line-2);border-radius:12px;background:var(--surface);overflow:hidden}
.mjhead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mjtitle{font-size:16px}
.mjback{color:#1F5C5C;font-size:18px}
.mjbtn{background:#1F5C5C;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.mjbody{display:grid;grid-template-columns:1fr 200px;gap:16px;padding:18px;background-color:var(--surface-2);background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:16px 16px;min-height:460px}
@media (max-width:900px){.mjbody{grid-template-columns:1fr}}
.mjcanvas{display:flex;flex-direction:column;align-items:center}

// ---------- State ----------
const fresh = () => ({tab:'proto',group:'goal',xblocks:[],xbMenu:null,countKind:null,neg:{},giftNot:false,extraNot:{},extra:[],segMenu:false,openBucket:null,seg:null,params:{},pop:null,narrowMenu:false,cond:{},joinTop:'and',joinGift:'and',modal:null,enroll:'new',notes:true,adv:false,view:null,bmode:'own',custom:{},content:{},draft:{},removed:{},senders:[],verified:[],sname:'',semail:'',already:false,sender:false,domain:false,editTpl:null});
let S = fresh();

function step(){
  if(S.modal==='domain') return 13;
  if(S.view==='editor') return 12;
  if(S.view==='builder') return S.bmode==='ready'?11:10;
  if(S.modal==='build') return 9;
  if(S.modal==='automate'||S.modal==='preview') return 8;
  if(S.modal==='autochoose') return 7;
  if(S.modal==='save') return 6;
  if(S.extra.length) return 14;
  if(activeConds().length) return 5;
  if(S.seg && (S.pop||edited())) return 4;
  if(S.seg) return 3;
  if(S.openBucket) return 2;
  return 1;
}
function edited(){ if(!S.seg) return false; const d=SEG[S.seg].defaults; return Object.keys(d).some(k=>S.params[k]!==d[k]) || usesOr() || S.extra.length>0 || S.xblocks.length>0; }
function usesOr(){ return S.joinTop==='or'||S.joinGift==='or'; }
function pin(key){
  if(!S.notes || S.tab!=='proto') return '';
  const items = NOTES[step()].items; const i = items.findIndex(it=>it[0]===key);
  return i<0 ? '' : '<span class="pin" aria-label="Note '+(i+1)+'">'+(i+1)+'</span>';
}

// ---------- Filtering ----------
function matchingGift(x,seg){
  const w = seg ? whichNow() : 'any';
  if(seg && (w==='first'||w==='last')){ const k=kindNow(), g=w==='first'?firstK(x,k):lastK(x,k); return g?[g]:[]; }
  if(seg && seg.giftKey && w==='none'){ const g=lastK(x,S.params.kind||'any'); return g?[g]:[]; }
  return x.gifts;
}
function results(){
  if(!S.seg) return {people:PEOPLE,gifts:PEOPLE.flatMap(x=>x.gifts),scoped:false};
  const seg=SEG[S.seg]; const p=S.params;
  const giftConds = activeConds().filter(c=>c.level==='gift'), personConds = activeConds().filter(c=>c.level==='person');
  const comb = (join,parts) => parts.length===0 ? true : join==='and' ? parts.every(Boolean) : parts.some(Boolean);
  const giftOk = g => comb(S.joinGift, giftConds.map(c=>c.gift(g,S.cond[c.id])));
  // The "same gift" group: the segment's own gift rule (if any) plus gift conditions, combined with the group's and / or.
  const groupOk = x => {
    // "None of their …": no gift of that kind meets the gift rules. Only offered when the segment's own rule isn't about a gift.
    if(giftNotOn()) return giftConds.length ? !x.gifts.some(g=>okK(g,kindNow())&&comb(S.joinGift,giftConds.map(c=>c.gift(g,S.cond[c.id])))) : null;
    if(whichNow()==='first'||whichNow()==='last'){
      const g = matchingGift(x,seg)[0], parts=[]; if(!g) return false;
      if(seg.ruleOnGift) parts.push(seg.test(x,p));
      giftConds.forEach(c=>parts.push(c.gift(g,S.cond[c.id])));
      return parts.length ? comb(S.joinGift,parts) : null;
    }
    return giftConds.length ? x.gifts.some(g=>okK(g,kindNow())&&giftOk(g)) : null;
  };
  let people = PEOPLE.filter(x=>{
    const parts=[];
    if(!seg.ruleOnGift) parts.push(seg.test(x,p));
    const gm = groupOk(x);
    personConds.forEach(c=>parts.push(c.person(x,S.cond[c.id])!==!!S.neg[c.id]));
    // Added segments: each is checked on its own, with its own gift. They join at the person level.
    S.extra.forEach(id=>parts.push(SEG[id].test(x,SEG[id].defaults)!==!!S.extraNot[id]));
    let r = comb(S.joinTop,parts);
    // Each gift joins with its own connector: And / Or / But not
    const joinIn = (r,ok,j) => j==='or' ? (r||ok) : j==='not' ? (r&&!ok) : (r&&ok);
    if(gm!==null) r = joinIn(r, gm, S.gjoin||'and');
    for(const b of S.xblocks) r = joinIn(r, xblockOk(x,b), b.join||'and');
    return r;
  });
  const gifts = people.flatMap(x=>matchingGift(x,seg).filter(g=>giftNotOn()||!giftConds.length||giftOk(g)));
  return {people,gifts,scoped:true};
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderApp(){

function renderBuckets(){
  const seg=S.seg?SEG[S.seg]:null;
  return `<div class="reach"><span class="label">${S.group==='type'?'Who do you want to find?':'What do you want to do?'}</span>

function staticRule(s){
  return s.rule.map(t=>{
    if(t[0]!=='p') return esc(t[1]);

}
// Counts and amounts are typed, not picked from a short list.

function goto(n){
  const notes=S.notes, group=S.group; S=fresh(); S.notes=notes; S.group=group;
  if(n===14){pick('mid');S.adv=true;S.extra=['lapsing'];return}
  if(n===2){S.openBucket=S.group==='type'?'trep':'more'}
  if(n>=3){pick('lapsing')}
  if(n===4){S.params.from=3;S.pop='from'}
  if(n>=5){S.cond.campaign='Feed the Community'}
  if(n===6){S.modal='save'}
  if(n===7){S.modal='autochoose'}
  if(n===8){S.modal='automate'}
  if(n===9){S.modal='build'}
  if(n===10){S.view='builder';S.bmode='own'}
  if(n===11){S.view='builder';S.bmode='ready'}
  if(n===12){S.view='editor';S.editTpl=0;S.draft={}}
  if(n===13){S.modal='domain';S.dstep='start';S.dname='';S.sname='';S.semail=''}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  const inMenu=e.target.closest('.menu,.vmenu,.nmenu,.bucket,.val,.narrow');
  if(!el){ if(!inMenu && (S.openBucket||S.pop||S.narrowMenu||S.segMenu||S.xbMenu!==null||S.gbMenu)){S.openBucket=null;S.pop=null;S.narrowMenu=false;S.segMenu=false;S.xbMenu=null;S.gbMenu=false;render()} return; }
  const a=el.dataset.a, v=el.dataset.v;
  if(a==='closebg' && e.target!==el) return;
  e.stopPropagation();
  switch(a){
    case 'tab': S.tab=v; break;
    case 'goto': goto(+v); break;
    case 'notes': S.notes=!S.notes; break;
    case 'group': S.group=v; S.openBucket=null; S.pop=null; break;
    case 'bucket': S.openBucket = S.openBucket===v?null:v; S.pop=null; S.narrowMenu=false; break;
    case 'clear': S.gbOn=false;S.gbMenu=false;S.xblocks=[];S.xbMenu=null;S.countKind=null;S.which=null;S.basis=null;S.neg={};S.giftNot=false;S.extraNot={};S.extra=[];S.segMenu=false;S.seg=null;S.params={};S.cond={};S.joinTop='and';S.joinGift='and';S.adv=false;S.openBucket=null;S.pop=null; break;
    case 'pick': pick(v); break;
    case 'pop': S.pop = S.pop===v?null:v; S.narrowMenu=false; S.openBucket=null; break;
    case 'set': {
      const k=el.dataset.k, val=isNaN(+v)?v:+v; S.params[k]=val;
      if(k==='from'&&S.params.to<=val){const o=OPT.months.find(o=>o.v>val);if(o)S.params.to=o.v}
      if(k==='to'&&S.params.from>=val){const o=[...OPT.months].reverse().find(o=>o.v<val);if(o)S.params.from=o.v}
      if(k==='min'&&S.params.max!==undefined&&S.params.max<=val){const o=OPT.money.find(o=>o.v>val);if(o)S.params.max=o.v}
      if(k==='max'&&S.params.min>=val){const o=[...OPT.money].reverse().find(o=>o.v<val);if(o)S.params.min=o.v}
      S.pop=null; break; }
    case 'reset': S.gbOn=false;S.gbMenu=false;S.xblocks=[];S.xbMenu=null;S.countKind=null;S.which=null;S.basis=null;S.neg={};S.giftNot=false;S.extraNot={};S.extra=[]; S.params={...SEG[S.seg].defaults,gk:'any'}; S.joinTop='and'; S.joinGift='and'; S.pop=null; break;
    case 'join': if(v==='top') S.joinTop=S.joinTop==='and'?'or':'and'; else S.joinGift=S.joinGift==='and'?'or':'and'; S.pop=null; break;
    case 'nmenu': S.narrowMenu=!S.narrowMenu; S.segMenu=false; S.pop=null; break;
    case 'segmenu': S.segMenu=!S.segMenu; S.narrowMenu=false; S.pop=null; break;
    case 'xadd': if(!S.extra.includes(v)) S.extra.push(v); S.segMenu=false; break;
    case 'xrm': S.extra=S.extra.filter(x=>x!==v); break;
    case 'addc': S.gbMenu=false; S.cond[v]= v==='state' ? regionOpts()[0].v : v==='method' ? condOpts(COND.method)[0].v : COND[v].def; S.narrowMenu=false; S.pop='c:'+v; break;
    case 'cset': { const c=COND[el.dataset.c]; const o=condOpts(c).find(o=>String(o.v)===v); S.cond[c.id]=o?o.v:v; S.pop=null;
      if(c.id==='gtype'&&S.cond.method!==undefined&&!condOpts(COND.method).some(o=>o.v===S.cond.method)) S.cond.method=condOpts(COND.method)[0].v;
      if(c.id==='gtype'&&S.cond.lastwhen==='afterrec'&&!afterRecOk(S.cond.gtype)) S.cond.lastwhen='in90';
      if(c.id==='country'&&S.cond.state!==undefined&&!REGIONS[S.cond.country].includes(S.cond.state)) S.cond.state=REGIONS[S.cond.country][0];
      break; }
    case 'ucond': delete S.cond[v]; delete S.neg[v]; if(v==='giving') S.basis=null; if(!activeConds().some(c=>c.level==='gift')) S.giftNot=false; S.pop=null; break;
    case 'neg': S.neg[v]=!S.neg[v]; S.pop=null; break;
    case 'gneg': S.giftNot=!S.giftNot; S.pop=null; break;
    case 'wset': S.which=v; if(v!=='any') S.whichN=null; S.gbMenu=false; S.pop=null; break;
    case 'hmadd': S.which='any'; S.whichN=3; S.gbMenu=false; break;
    case 'hmrm': S.whichN=null; break;
    case 'xhmadd': { const b=S.xblocks[+el.dataset.i]; b.which='any'; b.n=3; S.xbMenu=null; break; }
    case 'xhmrm': delete S.xblocks[+el.dataset.i].n; break;
    case 'ckset': S.countKind=v; S.pop=null; break;
    case 'xbadd': S.xblocks.push({which:'any',kind:'repeated',cond:{lastwhen:afterRecOk('repeated')?'afterrec':'in90'}}); S.xbMenu=S.xblocks.length-1; S.narrowMenu=false; break;
    case 'xbrm': S.xblocks.splice(+v,1); S.pop=null; break;
    case 'xbwhich': { const b=S.xblocks[+el.dataset.i]; b.which=v; if(v!=='any') delete b.n; S.xbMenu=null; S.pop=null; break; }
    case 'gjset': S.gjoin=v; S.pop=null; break;
    case 'xbjoin': S.xblocks[+el.dataset.i].join=v; S.pop=null; break;
    case 'xbkind': { const b=S.xblocks[+el.dataset.i]; b.kind=v; if(v==='recurring'&&b.cond.method&&!OPT.methodrec.some(o=>o.v===b.cond.method)) b.cond.method='Card'; if(v==='recurring') delete b.cond.after; if(b.cond.lastwhen==='afterrec'&&!afterRecOk(v)) b.cond.lastwhen='in90'; S.pop=null; break; }

    case 'gbmenu': S.gbMenu=!S.gbMenu; S.narrowMenu=false; S.pop=null; break;
    case 'xbmenu': S.xbMenu = S.xbMenu===+v?null:+v; S.pop=null; break;
    case 'xbaddc': { const b=S.xblocks[+el.dataset.i]; b.cond[v]= v==='after'?true : v==='method'?xOpts(b,'method')[0].v : COND[v].def; S.xbMenu=null; break; }
    case 'xbcrm': delete S.xblocks[+el.dataset.i].cond[v]; break;
    case 'xbcset': { const b=S.xblocks[+el.dataset.i], o=xOpts(b,el.dataset.c).find(o=>String(o.v)===v); b.cond[el.dataset.c]=o?o.v:v; S.pop=null; break; }
    case 'bset': S.basis=isNaN(+v)?v:+v; S.pop=null; break;
    case 'xneg': S.extraNot[v]=!S.extraNot[v]; S.pop=null; break;
    case 'automate': S.modal='autochoose'; S.enroll='new'; break;
    case 'pickready': S.modal='automate'; break;
    case 'pickbuild': S.modal='build'; break;
    case 'back': S.modal='autochoose'; break;
    case 'save': S.modal='save'; break;
    case 'dosave': S.modal=null; render(); toast('Saved to Lists as a dynamic list'); return;
    case 'openbuilder': S.modal=null; S.view='builder'; S.bmode='own'; break;
    case 'adjust': S.modal=null; S.view='builder'; S.bmode='ready'; break;
    case 'backsup': S.view=null; break;
    case 'email': S.modal='email'; break;
    case 'enroll': S.enroll=v; break;
    case 'close': case 'closebg': S.modal=null; break;
    case 'turnon': { const sg=SEG[S.seg], a=AUTOS[sg.auto]; if(!(live(sg).every(({i})=>S.custom[ek(sg,i)])&&S.sender)) return; S.modal=null; render(); toast('Automation turned on'); return; }
    case 'rmmail': { const sg=SEG[S.seg]; if(live(sg).length>1){ S.removed[ek(sg,+v)]=true; render(); toast('Email removed. You can add it back below.'); return; } break; }
    case 'addmail': delete S.removed[ek(SEG[S.seg],+v)]; break;

    case 'closeprev': S.modal = S.prevFrom==='editor' ? null : 'automate'; S.prevFrom=null; break;

    case 'prevtpl': { const L=live(SEG[S.seg]), p=L.findIndex(x=>x.i===(S.prevTpl||0)); if(p>0) S.prevTpl=L[p-1].i; break; }
    case 'nexttpl': { const L=live(SEG[S.seg]), p=L.findIndex(x=>x.i===(S.prevTpl||0)); if(p<L.length-1) S.prevTpl=L[p+1].i; break; }
    case 'customize': S.savedFlash=false; S.prevFrom=null; S.draft={...(S.content[ek(SEG[S.seg],+v)]||{})}; S.modal=null; S.view='editor'; S.editTpl=+v; break;

});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.modal){S.modal=null} else {S.openBucket=null;S.pop=null;S.narrowMenu=false;S.segMenu=false;S.xbMenu=null;S.gbMenu=false} render(); }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click()}
});
render();
})();
